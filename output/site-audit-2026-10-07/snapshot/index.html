  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #061108; color: #9bcfa2; font-family: Inter, sans-serif; }
        .initial-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 16px; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
        .initial-loader svg { width: 15px; height: 15px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .initial-loader svg { animation: none; } }
      </style>
      <div class="initial-loader" aria-live="polite">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Gathering pieces...
      </div>
    </div>
    <noscript>
      <style>#root:not(:empty) ~ noscript, .nucleus-loader { display: none !important; }</style>
      <main class="logo-landing" aria-label="Nucleus">
        <svg class="logo-landing__fallback" viewBox="430 128 672 625" role="img" aria-label="Nucleus logo">
